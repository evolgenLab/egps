<%@ taglib prefix="s" uri="/struts-tags" %>
<%@page language="java" import="java.io.*" pageEncoding="UTF-8" %>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eGPS Cloud</title>

    <script src="/egpscloud/egps/js/jquery.min.1.12.4.js" type="text/javascript"></script>
    <script src="/egpscloud/egps/js/bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
    <script src="/egpscloud/js/echarts.min.js" type="text/javascript"></script>
    <link href="/egpscloud/egps/js/bootstrap/css/bootstrap.min.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/share.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/buttons.css" type="text/css" rel="stylesheet"/>

</head>

<body>

<div class="container">
    <!-- top start-->
    <jsp:include page="/inc/header.html"/>
    <!-- top end-->


    <!-- content start -->


    <div class="row">
        <div class="col-md-12">
            <div><h3><s:property value='#parameters.ptitle'/></h3></div>

            <div class="panel" style="margin-top:20px;">
                <div class="panel-body" style="padding:0px; border:none;">
                    <div id="idchart" style="width:600px;height:400px;">


                    </div>


                </div>
            </div>

        </div>
    </div>


    <!-- content end -->
    <jsp:include page="/inc/footer.html"/>


</div>

<script type="text/javascript" language="javascript">

    var myChart = echarts.init(document.getElementById('idchart'));
    var ptitle = "<s:property value='#parameters.ptitle' />";
    var title = "<s:property value='#parameters.ltitle' />";
    var title2 = "<s:property value='#parameters.ltitle1' />";
    var infile = "<s:property value='#parameters.infile' />";
    var infile2 = "<s:property value='#parameters.infile1' />";
    var weburl = "http://biocloud.big.ac.cn/ajax/ajaxshowDrawEchartErrorBar.action?time=" + new Date().getTime();
    var nameparam = {"infile": infile, "infile1": infile2};
    var categoryarry = [];
    categoryarry.push(title);
    categoryarry.push(title2);

    function renderItem(params, api) {
        var xValue = api.value(0);
        var highPoint = api.coord([xValue, api.value(1)]);
        var lowPoint = api.coord([xValue, api.value(2)]);
        var halfWidth = api.size([1, 0])[0] * 0.1;
        var style = api.style({
            stroke: api.visual('color'),
            fill: null
        });

        return {
            type: 'group',
            children: [{
                type: 'line',
                shape: {
                    x1: highPoint[0] - halfWidth, y1: highPoint[1],
                    x2: highPoint[0] + halfWidth, y2: highPoint[1]
                },
                style: style
            }, {
                type: 'line',
                shape: {
                    x1: highPoint[0], y1: highPoint[1],
                    x2: lowPoint[0], y2: lowPoint[1]
                },
                style: style
            }, {
                type: 'line',
                shape: {
                    x1: lowPoint[0] - halfWidth, y1: lowPoint[1],
                    x2: lowPoint[0] + halfWidth, y2: lowPoint[1]
                },
                style: style
            }]
        };
    }

    $.ajax({
        url: weburl,
        type: 'get',
        crossDomain: true,
        dataType: 'json',
        data: nameparam,
        success: function (data) {

            option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                title: {
                    text: ptitle
                },
                legend: {
                    data: categoryarry
                },
                dataZoom: [{
                    type: 'slider',
                    start: 50,
                    end: 70
                }, {
                    type: 'inside',
                    start: 50,
                    end: 70
                }],
                xAxis: {
                    data: data.xdata
                },
                yAxis: {},
                series: [{
                    type: 'bar',
                    name: title,
                    data: data.ydata,
                    itemStyle: {
                        normal: {
                            color: '#77bef7'
                        }
                    }
                }, {
                    type: 'custom',
                    name: title2,
                    itemStyle: {
                        normal: {
                            borderWidth: 1.5
                        }
                    },
                    renderItem: renderItem,
                    encode: {
                        x: 0,
                        y: [1, 2]
                    },
                    data: data.ydata1,
                    z: 100
                }]
            };


            myChart.setOption(option);

        }
    });


</script>


<!-- 底部 end-->
</body>
</html>
