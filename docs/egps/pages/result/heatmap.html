<%@ taglib prefix="s" uri="/struts-tags" %>
<%@page language="java" import="java.io.*" pageEncoding="UTF-8" %>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eGPS Cloud</title>

    <script src="/egpscloud/egps/js/jquery.min.1.12.4.js" type="text/javascript"></script>
    <script src="/egpscloud/egps/js/bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
    <script src="/egpscloud/js/echarts.min.js" type="text/javascript"></script>
    <link href="/egpscloud/egps/js/bootstrap/css/bootstrap.min.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/share.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/buttons.css" type="text/css" rel="stylesheet"/>

</head>

<body>

<div class="container">
    <!-- top start-->
    <jsp:include page="/inc/header.html"/>
    <!-- top end-->


    <!-- content start -->


    <div class="row">
        <div class="col-md-12">
            <div><h3><s:property value='#parameters.ptitle'/></h3></div>

            <div class="panel" style="margin-top:20px;">
                <div class="panel-body" style="padding:0px; border:none;">
                    <div id="idchart" style="width:600px;height:400px;">


                    </div>


                </div>
            </div>

        </div>
    </div>


    <!-- content end -->
    <jsp:include page="/inc/footer.html"/>


</div>

<script type="text/javascript" language="javascript">

    var myChart = echarts.init(document.getElementById('idchart'));

    var title = "<s:property value='#parameters.ptitle' />";
    var infile = "<s:property value='#parameters.infile' />";
    var xaxis = "<s:property value='#parameters.xaxis' />";
    var yaxis = "<s:property value='#parameters.yaxis' />";


    var weburl = "http://biocloud.big.ac.cn/ajax/ajaxshowDrawEchartHeatmap.action?time=" + new Date().getTime();
    var nameparam = {"infile": infile};
    $.ajax({
        url: weburl,
        type: 'get',
        crossDomain: true,
        dataType: 'json',
        data: nameparam,
        success: function (data1) {

            var data = data1.xdata;


            data = data.map(function (item) {
                return [item[1], item[0], item[2] || '-'];
            });
            var xarry = [];

            if (xaxis.indexOf(",") > -1) {
                var tx = xaxis.split(",");
                for (var i = 0; i < tx.length; i++) {
                    var td = tx[i];
                    xarry.push(td);
                }
            }

            var yarry = [];
            if (yaxis.indexOf(",") > -1) {
                var tx = yaxis.split(",");
                for (var i = 0; i < tx.length; i++) {
                    var td = tx[i];
                    yarry.push(td);
                }
            }


            option = {
                tooltip: {
                    position: 'top'
                },
                animation: false,
                grid: {
                    height: '50%',
                    y: '10%'
                },
                xAxis: {
                    type: 'category',
                    data: xarry,
                    splitArea: {
                        show: true
                    }
                },
                yAxis: {
                    type: 'category',
                    data: yarry,
                    splitArea: {
                        show: true
                    }
                },
                visualMap: {
                    min: 0,
                    max: 10,
                    calculable: true,
                    orient: 'horizontal',
                    left: 'center',
                    bottom: '15%'
                },
                series: [{
                    name: '',
                    type: 'heatmap',
                    data: data,
                    label: {
                        normal: {
                            show: true
                        }
                    },
                    itemStyle: {
                        emphasis: {
                            shadowBlur: 10,
                            shadowColor: 'rgba(0, 0, 0, 0.5)'
                        }
                    }
                }]
            };


            myChart.setOption(option);


        }
    });


</script>


<!-- 底部 end-->
</body>
</html>
