<%@ taglib prefix="s" uri="/struts-tags" %>
<%@page language="java" import="java.io.*" pageEncoding="UTF-8" %>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pie Chart</title>
    <script src="/egpscloud/egps/js/jquery.min.1.12.4.js" type="text/javascript"></script>
    <script src="/egpscloud/egps/js/bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
    <script src="/egpscloud/js/echarts.min.js" type="text/javascript"></script>
    <link href="/egpscloud/egps/js/bootstrap/css/bootstrap.min.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/share.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/buttons.css" type="text/css" rel="stylesheet"/>

</head>

<body>

<div class="container">
    <jsp:include page="/inc/header.html"/>
    <!-- content start -->


    <div class="row">
        <div class="col-md-12">
            <div><h3>Nested Pies Chart</h3></div>

            <div class="panel" style="margin-top:20px;">
                <div class="panel-body" style="padding:0px; border:none;">
                    <div id="idchart" style="width:600px;height:400px;">


                    </div>


                </div>
            </div>

        </div>
    </div>


    <!-- content end -->
    <jsp:include page="/inc/footer.html"/>


</div>

<script type="text/javascript" language="javascript">

    var myChart = echarts.init(document.getElementById('idchart'));
    var title = "<s:property value='#parameters.ptitle' />";
    var infile = "<s:property value='#parameters.infile' />";
    var weburl = "http://biocloud.big.ac.cn/ajax/ajaxshowDrawEchartNestedPie.action";
    var nameparam = {"infile": infile};
    $.ajax({
        url: weburl,
        type: 'get',
        crossDomain: true,
        dataType: 'json',
        data: nameparam,
        success: function (data) {
            var category = data.categoryList;
            var xdatadarry = data.xdata;
            var ydataarry = data.ydata;
            option = {
                tooltip: {
                    trigger: 'item',
                    formatter: "{a} <br/>{b}: {c} ({d}%)"
                },
                legend: {
                    orient: 'vertical',
                    x: 'left',
                    data: category
                },
                series: [
                    {
                        name: title,
                        type: 'pie',
                        selectedMode: 'single',
                        radius: [0, '30%'],

                        label: {
                            normal: {
                                position: 'inner'
                            }
                        },
                        labelLine: {
                            normal: {
                                show: false
                            }
                        },
                        data: xdatadarry
                    },
                    {
                        name: title,
                        type: 'pie',
                        radius: ['40%', '55%'],
                        label: {
                            normal: {
                                formatter: '{a|{a}}{abg|}\n{hr|}\n  {b|{b}：}{c}  {per|{d}%}  ',
                                backgroundColor: '#eee',
                                borderColor: '#aaa',
                                borderWidth: 1,
                                borderRadius: 4,
                                // shadowBlur:3,
                                // shadowOffsetX: 2,
                                // shadowOffsetY: 2,
                                // shadowColor: '#999',
                                // padding: [0, 7],
                                rich: {
                                    a: {
                                        color: '#999',
                                        lineHeight: 22,
                                        align: 'center'
                                    },

                                    hr: {
                                        borderColor: '#aaa',
                                        width: '100%',
                                        borderWidth: 0.5,
                                        height: 0
                                    },
                                    b: {
                                        fontSize: 16,
                                        lineHeight: 33
                                    },
                                    per: {
                                        color: '#eee',
                                        backgroundColor: '#334455',
                                        padding: [2, 4],
                                        borderRadius: 2
                                    }
                                }
                            }
                        },
                        data: ydataarry
                    }
                ]
            };


            myChart.setOption(option);

        }


    });


</script>


<!-- 底部 end-->
</body>
</html>
