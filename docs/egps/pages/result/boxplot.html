<%@ taglib prefix="s" uri="/struts-tags" %>
<%@page language="java" import="java.io.*" pageEncoding="UTF-8" %>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eGPS Cloud</title>

    <script src="/egpscloud/egps/js/jquery.min.1.12.4.js" type="text/javascript"></script>
    <script src="/egpscloud/egps/js/bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
    <script src="/egpscloud/js/echarts.min.js" type="text/javascript"></script>
    <script src="/egpscloud/egps/js/dataTool.js" type="text/javascript"></script>
    <link href="/egpscloud/egps/js/bootstrap/css/bootstrap.min.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/share.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/buttons.css" type="text/css" rel="stylesheet"/>

</head>

<body>

<div class="container">
    <!-- top start-->
    <jsp:include page="/inc/header.html"/>
    <!-- top end-->


    <!-- content start -->


    <div class="row">
        <div class="col-md-12">
            <div><h3><s:property value='#parameters.ptitle'/></h3></div>

            <div class="panel" style="margin-top:20px;">
                <div class="panel-body" style="padding:0px; border:none;">
                    <div id="idchart" style="width:600px;height:400px;">


                    </div>


                </div>
            </div>

        </div>
    </div>


    <!-- content end -->
    <jsp:include page="/inc/footer.html"/>


</div>

<script type="text/javascript" language="javascript">

    var myChart = echarts.init(document.getElementById('idchart'));

    var title = "<s:property value='#parameters.ptitle' />";
    var ytitle = "<s:property value='#parameters.ytitle' />";
    var infile = "<s:property value='#parameters.infile' />";
    var weburl = "http://biocloud.big.ac.cn/ajax/ajaxshowDrawEchartBoxplot.action?time=" + new Date().getTime();
    var nameparam = {"infile": infile};
    $.ajax({
        url: weburl,
        type: 'get',
        crossDomain: true,
        dataType: 'json',
        data: nameparam,
        success: function (data1) {

            var data = echarts.dataTool.prepareBoxplotData(data1.xdata);

            option = {
                title: [
                    {
                        text: title,
                        left: 'center',
                    },
                    {
                        text: 'upper: Q3 + 1.5 * IRQ \nlower: Q1 - 1.5 * IRQ',
                        borderColor: '#999',
                        borderWidth: 1,
                        textStyle: {
                            fontSize: 14
                        },
                        left: '10%',
                        top: '90%'
                    }
                ],
                tooltip: {
                    trigger: 'item',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                grid: {
                    left: '10%',
                    right: '10%',
                    bottom: '15%'
                },
                xAxis: {
                    type: 'category',
                    data: data.axisData,
                    boundaryGap: true,
                    nameGap: 30,
                    splitArea: {
                        show: false
                    },
                    axisLabel: {
                        formatter: 'expr {value}'
                    },
                    splitLine: {
                        show: false
                    }
                },
                yAxis: {
                    type: 'value',
                    name: ytitle,
                    splitArea: {
                        show: true
                    }
                },
                series: [
                    {
                        name: 'boxplot',
                        type: 'boxplot',
                        data: data.boxData,
                        tooltip: {
                            formatter: function (param) {
                                return [
                                    'upper: ' + param.data[5],
                                    'Q3: ' + param.data[4],
                                    'median: ' + param.data[3],
                                    'Q1: ' + param.data[2],
                                    'lower: ' + param.data[1]
                                ].join('<br/>')
                            }
                        }
                    },
                    {
                        name: 'outlier',
                        type: 'scatter',
                        data: data.outliers
                    }
                ]
            };


            myChart.setOption(option);


        }
    });


</script>


<!-- 底部 end-->
</body>
</html>
