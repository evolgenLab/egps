<%@ taglib prefix="s" uri="/struts-tags" %>
<%@page language="java" import="java.io.*" pageEncoding="UTF-8" %>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eGPS Cloud</title>

    <script src="/egpscloud/egps/js/jquery.min.1.12.4.js" type="text/javascript"></script>
    <script src="/egpscloud/egps/js/bootstrap/js/bootstrap.min.js" type="text/javascript"></script>
    <script src="/egpscloud/js/echarts.min.js" type="text/javascript"></script>
    <link href="/egpscloud/egps/js/bootstrap/css/bootstrap.min.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/share.css" type="text/css" rel="stylesheet"/>
    <link href="/egpscloud/egps/css/buttons.css" type="text/css" rel="stylesheet"/>

</head>

<body>

<div class="container">
    <!-- top start-->
    <jsp:include page="/inc/header.html"/>
    <!-- top end-->


    <!-- content start -->


    <div class="row">
        <div class="col-md-12">
            <div><h3><s:property value='#parameters.ptitle'/></h3></div>

            <div class="panel" style="margin-top:20px;">
                <div class="panel-body" style="padding:0px; border:none;">
                    <div id="idchart" style="width:600px;height:400px;">


                    </div>


                </div>
            </div>

        </div>
    </div>


    <!-- content end -->
    <jsp:include page="/inc/footer.html"/>


</div>

<script type="text/javascript" language="javascript">

    var myChart = echarts.init(document.getElementById('idchart'));
    var ptitle = "<s:property value='#parameters.ptitle' />";
    var title = "<s:property value='#parameters.ltitle' />";
    var title2 = "<s:property value='#parameters.ltitle1' />";
    var infile = "<s:property value='#parameters.infile' />";
    var infile2 = "<s:property value='#parameters.infile1' />";
    var weburl = "http://biocloud.big.ac.cn/ajax/ajaxshowDrawEchartMultipleLine.action?time=" + new Date().getTime();
    var nameparam = {"infile": infile, "infile1": infile2};
    var categoryarry = [];
    categoryarry.push(title);
    categoryarry.push(title2);

    var itemStyle = {
        normal: {},
        emphasis: {
            barBorderWidth: 1,
            shadowBlur: 10,
            shadowOffsetX: 0,
            shadowOffsetY: 0,
            shadowColor: 'rgba(0,0,0,0.5)'
        }
    };


    $.ajax({
        url: weburl,
        type: 'get',
        crossDomain: true,
        dataType: 'json',
        data: nameparam,
        success: function (data) {
            option = {
                backgroundColor: '#eee',
                legend: {
                    data: categoryarry,
                    align: 'left',
                    left: 10
                },
                brush: {
                    toolbox: ['rect', 'polygon', 'lineX', 'lineY', 'keep', 'clear'],
                    xAxisIndex: 0
                },
                toolbox: {
                    feature: {
                        magicType: {
                            type: ['stack', 'tiled']
                        },
                        dataView: {}
                    }
                },
                tooltip: {},
                xAxis: {
                    data: data.xdata,
                    name: '',//X Axis
                    silent: false,
                    axisLine: {onZero: true},
                    splitLine: {show: false},
                    splitArea: {show: false}
                },
                yAxis: {
                    inverse: true,
                    splitArea: {show: false}
                },
                grid: {
                    left: 100
                },
                visualMap: {
                    type: 'continuous',
                    dimension: 1,
                    text: ['High', 'Low'],
                    inverse: true,
                    itemHeight: 200,
                    calculable: true,
                    min: -2,
                    max: 6,
                    top: 60,
                    left: 10,
                    inRange: {
                        colorLightness: [0.4, 0.8]
                    },
                    outOfRange: {
                        color: '#bbb'
                    },
                    controller: {
                        inRange: {
                            color: '#2f4554'
                        }
                    }
                },
                series: [
                    {
                        name: title,
                        type: 'bar',
                        stack: 'one',
                        itemStyle: itemStyle,
                        data: data.ydata
                    },
                    {
                        name: title2,
                        type: 'bar',
                        stack: 'one',
                        itemStyle: itemStyle,
                        data: data.ydata1
                    }
                ]
            };

            myChart.setOption(option);
            myChart.on('brushSelected', renderBrushed);


        }
    });


    function renderBrushed(params) {
        var brushed = [];
        var brushComponent = params.batch[0];

        for (var sIdx = 0; sIdx < brushComponent.selected.length; sIdx++) {
            var rawIndices = brushComponent.selected[sIdx].dataIndex;
            brushed.push('[Series ' + sIdx + '] ' + rawIndices.join(', '));
        }

        myChart.setOption({
            title: {
                backgroundColor: '#333',
                text: 'SELECTED DATA INDICES: \n' + brushed.join('\n'),
                bottom: 0,
                right: 0,
                width: 100,
                textStyle: {
                    fontSize: 12,
                    color: '#fff'
                }
            }
        });
    }

</script>


<!-- 底部 end-->
</body>
</html>
